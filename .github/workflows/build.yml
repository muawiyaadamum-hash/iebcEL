name: Build and verify IEBC E-Learning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run lint (existing lint debt is reported but does not block packaging)
        run: npm run lint
        continue-on-error: true
      - name: Build production site
        run: npm run build
      - name: Verify production output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          if grep -q 'src/main.tsx' dist/index.html; then
            echo "Production HTML still references the source entry point."
            exit 1
          fi
          test -d dist/assets
          echo "Production output verified."
      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iebc-production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  publish-hostinger-branch:
    name: Publish production files to hostinger-deploy branch
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Download verified production build
        uses: actions/download-artifact@v4
        with:
          name: iebc-production-dist
          path: dist/

      - name: Publish compiled website to GitHub deployment branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: hostinger-deploy
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy production build from ${{ github.sha }}"

name: Build and verify IEBC E-Learning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Build production site
        run: npm run build
      - name: Verify production output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          if grep -q 'src/main.tsx' dist/index.html; then
            echo "Production HTML still references the source entry point."
            exit 1
          fi
          test -d dist/assets
          echo "Production output verified."
      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iebc-production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
